overview:
  title: "Remote sensing across built and natural environments"
  title_line_1: "Remote sensing across"
  title_line_2: "built and natural environments"
  description: >-
    Earth-observation research connects satellite imagery, photogrammetry,
    3D data, and artificial intelligence to measure form and change across
    cities, forests, glaciers, and inland waters.
  image: "/assets/images/research/remote-sensing-overview.jpg"
  image_alt: >-
    Integrated remote-sensing view of a city, forest and burned area,
    glaciated mountains, and a lake with geospatial data overlays.
  caption: >-
    One observing system, many landscapes: measuring form, function, and
    change from individual structures to regional ecosystems.

directions:
  - id: "built-environments"
    label: "Urban"
    title: "Built environments and 3D reconstruction"
    image: "/assets/images/research/urban-3d-reconstruction.png"
    image_alt: "Satellite-derived three-dimensional building models colored by elevation"
    figure_caption: "Satellite-derived LoD-2 building reconstruction showing modeled roof forms and relative heights."
    description: >-
      Satellite-derived orthophotos and digital surface models support scalable
      LoD-2 building reconstruction across large urban areas. The research
      combines deep-learning detection and instance segmentation with polygon
      regularization, roof-structure inference, and model fitting to recover
      individual buildings and roof geometry, including dense structures with
      shared boundaries. These workflows reduce reliance on aerial imagery,
      LiDAR, and external terrain models while improving geometric completeness
      and transferability across cities.
    methods:
      - "Satellite photogrammetry"
      - "LoD-2 modeling"
      - "Object detection"
      - "3D reconstruction"
    publications:
      - title: "Automated LoD-2 model reconstruction from very-high-resolution satellite-derived digital surface model and orthophoto"
        year: "2021"
        url: "https://doi.org/10.1016/j.isprsjprs.2021.08.025"
      - title: "SAT2LOD2: software for automated LoD-2 building reconstruction"
        year: "2022"
        url: "https://doi.org/10.5194/isprs-archives-XLIII-B2-2022-379-2022"
      - title: "Unit-Level LoD-2 Building Reconstruction from Satellite-Derived DSM and Orthophoto"
        year: "2024"
        url: "https://doi.org/10.5194/isprs-annals-X-2-2024-81-2024"
      - title: "Sat2Building: LoD-2 Building Reconstruction from Satellite Imagery Using Spatial Embeddings"
        year: "2025"
        url: "https://doi.org/10.14358/PERS.24-00097R3"

  - id: "forests-wildfire"
    label: "Forest"
    title: "Forest resilience and wildfire"
    image: "/assets/images/research/forest-wildfire.png"
    image_alt: "Global maps and charts of persistent forest loss, recovery, resilience, and mitigation potential"
    figure_caption: "Global evidence of postfire forest persistence, structural and functional recovery, and mitigation potential."
    description: >-
      Satellite-observed trajectories of forest structure and ecosystem
      function are used to quantify postfire recovery, persistent forest loss,
      and changing biomass across landscapes. Analyses connect fire severity,
      repeat burning, climate, and spatial configuration to forest resilience,
      while evaluating whether earlier low-severity fire can moderate the
      long-term consequences of subsequent wildfire. This work helps identify
      high-risk regions and supports targeted management from regional to
      global scales.
    methods:
      - "Satellite time series"
      - "Spatial pattern analysis"
      - "Disturbance ecology"
      - "Forest resilience"
    publications:
      - title: "Prior low-severity burns reduce risk of persistent forest loss from subsequent fires"
        year: "Under review"
        url: "https://doi.org/10.64898/2026.08.23.746551"
      - title: "Prolonged Postfire Recovery of Forest Spatial Structure Revealed by Patch Area and Edge Integrity"
        year: "In progress"
        url: ""
      - title: "Accelerated biomass loss in western US forests due to shifting fire regime"
        year: "Under review"
        url: ""

  - id: "mountains-glaciers"
    label: "Glacier"
    title: "Glacier 3D dynamics"
    image: "/assets/images/research/glacier-dynamics.png"
    image_alt: "Satellite-derived three-dimensional terrain model and glacier surface-velocity map"
    figure_caption: "Satellite-derived 3D terrain and surface-velocity mapping for glacier dynamics."
    description: >-
      High-cadence PlanetScope stereo imagery is converted into co-registered
      time-series elevation models and orthophotos to measure glacier elevation
      change, surface motion, and volumetric dynamics in three dimensions. The
      workflow resolves seasonal and longer-term trends in remote mid-latitude
      glaciers, compares elevation trajectories with independent observations,
      and relates changes in glacier flow to environmental drivers.
    methods:
      - "Time-series elevation models"
      - "PlanetScope imagery"
      - "Surface change"
      - "Glacier 3D dynamics"
    publications:
      - title: "Using PlanetScope-derived time-series elevation models and orthophotos to track glacier 3D dynamics in mid-latitude mountain regions"
        year: "2025"
        url: "https://doi.org/10.1080/15481603.2025.2507470"

  - id: "inland-waters"
    label: "Water"
    title: "Inland water quality"
    image: "/assets/images/research/inland-water-quality.png"
    image_alt: "Diagram showing field-to-satellite timing mismatch caused by algae moving vertically in the water column"
    figure_caption: "Field-to-satellite timing mismatch associated with diurnal algal vertical movement."
    description: >-
      Near-daily PlanetScope observations are combined with in-situ sonde
      profiles and a model of diurnal algal vertical migration to improve
      chlorophyll-a estimation. Temporally adjusting field-to-satellite matchups
      reduces observation mismatch, strengthens estimates during non-bloom
      periods, and supports transfer across multiple lakes. The resulting
      sensor-agnostic preprocessing framework is designed for routine water-quality
      monitoring and earlier harmful-algal-bloom alerts.
    methods:
      - "Multispectral imagery"
      - "Water quality"
      - "Chlorophyll-a"
      - "Process-based modeling"
    publications:
      - title: "Enhanced remote sensing of surface water Chlorophyll-a: Coupling dynamic algae vertical movement modeling with multi-spectral satellite images"
        year: "2026"
        url: "https://doi.org/10.1016/j.isprsjprs.2026.02.028"

  - id: "geoai"
    label: "GeoAI"
    title: "GeoAI"
    description: >-
      GeoAI research develops learning-based methods that connect Earth-observation
      imagery with visual and linguistic reasoning. The work spans object detection
      across optical, SAR, and multimodal remote-sensing data, as well as
      parameter-efficient text-image alignment for referring image segmentation.
      Recent methods use semantic language proxies and language-guided multi-scale
      spatial selection to adapt foundation models while updating only a small
      fraction of their backbone parameters.
    methods:
      - "Deep learning"
      - "Multimodal learning"
      - "Vision-language models"
      - "Parameter-efficient adaptation"
    publications:
      - title: "Remote Sensing Object Detection in the Deep Learning Era—A Review"
        year: "2024"
        url: "https://doi.org/10.3390/rs16020327"
      - title: "Semantic-Driven Scale and Spatial Selection for Efficient Cross-Modal Alignment in Referring Remote Sensing Image Segmentation"
        year: "2026"
        url: "https://arxiv.org/abs/2606.30244"
