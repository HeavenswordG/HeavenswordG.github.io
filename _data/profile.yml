short_bio: >-
  <p>
    I am a remote sensing scientist and recent postdoctoral researcher at the
    <a href="https://seas.umich.edu/" target="_blank" rel="noopener">University of Michigan School for Environment and Sustainability</a>.
    I develop Earth-observation methods that turn satellite imagery and geospatial data into measurements of built and natural environments.
  </p>
  <p>
    My research spans satellite photogrammetry and 3D reconstruction, urban mapping, forest resilience and wildfire, glacier dynamics, inland-water quality, deep learning, and GeoAI. I earned my Ph.D. in Civil, Environmental, and Geodetic Engineering from The Ohio State University, where my dissertation advanced satellite-photogrammetry applications for built-up area modeling and natural-environment monitoring.
  </p>
  <div class="research-tags" aria-label="Research areas">
    <span>Satellite photogrammetry</span>
    <span>3D reconstruction</span>
    <span>Environmental monitoring</span>
    <span>Deep learning &amp; GeoAI</span>
  </div>

