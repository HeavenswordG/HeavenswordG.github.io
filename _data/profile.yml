bio_title: "Remote sensing for a changing planet"
short_bio: >-
  <p>
    I am a remote sensing ecologist and postdoctoral researcher at the
    <a href="https://seas.umich.edu/" target="_blank" rel="noopener">University of Michigan School for Environment and Sustainability</a>.
    I use satellite imagery, LiDAR, photogrammetry, and machine learning to understand how forests respond to disturbance, recover, and store carbon in a warming world.
  </p>
  <p>
    I earned my Ph.D. in Remote Sensing and Photogrammetry from The Ohio State University in 2024. My work connects Earth observation with ecological and urban questions—from post-fire forest recovery and carbon dynamics to satellite-based 3D reconstruction.
  </p>
  <div class="research-tags" aria-label="Research areas">
    <span>Forest dynamics</span>
    <span>Wildfire</span>
    <span>Satellite photogrammetry</span>
    <span>Geospatial AI</span>
  </div>

